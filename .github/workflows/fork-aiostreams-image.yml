name: Fork image (AIOStreams source)

# Builds this fork's all-in-one image (Dockerfile.supervised) natively per
# architecture and publishes one multi-arch tag. The Flixvoornix host is
# arm64; amd64 is for the homelab's CI restore drill.
on:
  push:
    branches: [feat/aiostreams-source]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-aiostreams-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lmgveerhoek/tracearr

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch basemap
        uses: ./.github/actions/fetch-basemap
      - name: Fetch GeoIP (MaxMind)
        if: env.MAXMIND_LICENSE_KEY != ''
        uses: ./.github/actions/fetch-geoip
        with:
          license-key: ${{ secrets.MAXMIND_LICENSE_KEY }}
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
      # Without a MaxMind key: DB-IP Lite, the same MMDB layout as GeoLite2
      # City/ASN, free under CC BY 4.0 (https://db-ip.com).
      - name: Fetch GeoIP (DB-IP Lite)
        if: env.MAXMIND_LICENSE_KEY == ''
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          curl -fsSL "https://download.db-ip.com/free/dbip-city-lite-${month}.mmdb.gz" | gunzip > data/GeoLite2-City.mmdb
          curl -fsSL "https://download.db-ip.com/free/dbip-asn-lite-${month}.mmdb.gz" | gunzip > data/GeoLite2-ASN.mmdb
          ls -la data/*.mmdb
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.supervised
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:aiostreams-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-arch tags
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:aiostreams" -t "$IMAGE:aiostreams-$GITHUB_SHA" \
            "$IMAGE:aiostreams-$GITHUB_SHA-amd64" "$IMAGE:aiostreams-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "$IMAGE:aiostreams"
