name: Fork image (AIOStreams source)

# Builds this fork's all-in-one image (Dockerfile.supervised) for the
# Flixvoornix OCI host, which is arm64 only, natively on an arm64 runner.
on:
  push:
    branches: [feat/aiostreams-source]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-aiostreams-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.supervised
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/lmgveerhoek/tracearr:aiostreams
            ghcr.io/lmgveerhoek/tracearr:aiostreams-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
